server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip для текстовых ассетов (main.dart.js, canvaskit, json, wasm).
    # nginx ≥1.21.1 (база 1.27) отдаёт .js как text/javascript — без него в
    # списке main.dart.js (главный и самый тяжёлый ассет) шёл бы без сжатия.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # SPA-маршрутизация: всё, что не файл, отдаём index.html (любой путь → не 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Domain verification для universal/app links (invite_links): не должны
    # попадать в SPA-fallback выше и отдаются строго как файлы. AASA — без
    # расширения, поэтому явно проставляем Content-Type: application/json
    # (иначе default_type/octet-stream — iOS такой ответ не примет). Ни
    # редиректов, ни basic-auth на этих путях быть не должно.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }
    location /.well-known/ {
        try_files $uri =404;
    }

    # Точки входа нельзя кэшировать надолго — иначе новый деплой не подхватится.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ВАЖНО: ассеты Flutter под /assets/ (шрифт иконок MaterialIcons,
    # *Manifest.json, картинки, packages) имеют СТАБИЛЬНЫЕ имена, а НЕ content-hash.
    # Помечать их immutable нельзя: новый билд (напр. новые глифы иконок в
    # MaterialIcons-Regular.otf по тому же пути) не подхватится, пока не истечёт
    # год или клиент вручную не очистит кэш. Разрешаем ревалидацию — nginx отдаёт
    # ETag/Last-Modified, повторные запросы дёшевы (304), но новый контент приходит.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }
    # canvaskit лежит в версионированной по пути папке — можно кэшировать надолго.
    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
